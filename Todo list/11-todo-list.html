<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo-list</title>
  <link rel="stylesheet" href="styles/11-todo-list.css">
</head>
<body>
  <p>
    To-do list
  </p>
  <div class="todo-input-grid">
    <input type="text" placeholder="To-do name" class="js-name-input name-input">
    <input type="date" class="js-date-input due-date-input">
    <button 
    onclick="
    addTodo();" class="add-todo-button">
    Add
    </button>
  </div>
  <div class="js-todo-list todo-grid">
  </div>

  <script src="scripts/11-todo-list.js"></script>
  
</body>
</html>
