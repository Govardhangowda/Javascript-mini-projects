<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles/12-rock-paper-scissors.css">
</head>
<body> 
  <p class="title">
    Rock Paper Scissors
  </p>
  <p>
    <button onclick="
    determination('Rock')"
    class="move-button">
      <img src="images/rock-emoji.png" class="move-icon"  alt="">
    </button>

    <button
    onclick="
      determination('Paper')"
      class="move-button">
      <img src="images/paper-emoji.png" class="move-icon" alt="">
    </button>

    <button
    onclick="
    determination('Scissors');"
    class="move-button">
      <img src="images/scissors-emoji.png" class="move-icon" alt="">
    </button>

    
    
  </p>
  <p class="js-result result">

  </p>
  <p class="js-moves">
    
  </p>
  <p class="js-score score">

  </p>

  <button onclick="
    score.wins=0;
    score.loses=0;
    score.ties=0;
    localStorage.removeItem('score');
    updatescoreelement();"
    class="reset-score-button">
      Reset Score
    </button>

    <button class="auto-play-button"
    onclick="autoplay();">
      Autoplay
    </button>

  <script src="scripts/12-rock-paper-scissors.js"></script>
</body>
</html>
